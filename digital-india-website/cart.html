<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LooTZy | Shopping Cart</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <div class="container">
      <h1 class="logo">
        <img src="images/logo.svg" alt="LooTZy logo" class="logo-img" />
        <span class="logo-text">LooTZy</span>
      </h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="cart.html" class="cart-link active">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="9" cy="21" r="1"/>
                  <circle cx="20" cy="21" r="1"/>
                  <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
              </svg>
              <span class="cart-count">0</span>
          </a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="page-content">
    <div class="container">
      <div class="page-header">
        <h2>Shopping Cart</h2>
        <p class="page-subtitle">Review your items</p>
      </div>
      
      <div class="cart-wrapper">
        <div class="cart-items">
          <div class="empty-cart">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5">
              <circle cx="9" cy="21" r="1"/>
              <circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <h3>Your cart is empty</h3>
            <p>Add some products to get started</p>
            <a href="index.html" class="btn">Continue Shopping</a>
          </div>
          
          <!-- Cart items will be displayed here dynamically -->
        </div>
        
        <div class="cart-summary">
          <h3>Order Summary</h3>
          <div class="summary-row">
            <span>Subtotal</span>
            <span class="subtotal-amount">$0.00</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span>Free</span>
          </div>
          <div class="summary-row">
            <span>Tax</span>
            <span class="tax-amount">$0.00</span>
          </div>
          <hr>
          <div class="summary-row total">
            <span>Total</span>
            <span class="total-amount">$0.00</span>
          </div>
          <button class="btn checkout-btn">Proceed to Checkout</button>
          <a href="index.html" class="continue-shopping">Continue Shopping</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2025 LooTZy | Ecommerce Shopping</p>
  </footer>
</body>
</html>
