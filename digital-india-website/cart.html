<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LooTZy | Cart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="container">
    <h1 class="logo">
      <img src="images/logo.svg" class="logo-img" alt="logo">
      <span class="logo-text">LooTZy</span>
    </h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li>
          <a href="cart.html" class="active">
            Cart (<span class="cart-count">0</span>)
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>

<main class="page-content">
  <div class="container">

    <h2>Your Shopping Cart</h2>
    <p class="page-subtitle">Review and manage your products</p>

    <div class="cart-wrapper">


      <div class="cart-items">
        <p>Your cart is empty.</p>
      </div>


      <div class="cart-summary">
        <h3>Order Summary</h3>

        <div class="summary-row">
          <span>Total Items:</span>
          <span class="summary-count">0</span>
        </div>

        <div class="summary-row">
          <span>Total Price:</span>
          <span class="total-price">$0.00</span>
        </div>

        <button class="btn checkout-btn">Checkout</button>
        <a href="index.html" class="continue-shopping">← Continue Shopping</a>
      </div>

    </div>

  </div>
</main>

<footer>
  <p>© 2025 LooTZy | Ecommerce Shopping</p>
</footer>


<script src="js/cart.js"></script>

</body>
</html>
