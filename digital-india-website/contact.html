<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LooTZy | Contact</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>


    <header>
        <div class="container">
            <h1 class="logo">
                <img src="images/logo.svg" alt="LooTZy Logo" class="logo-img">
                <span class="logo-text">LooTZy</span>
            </h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a class="active" href="contact.html">Contact</a></li>
                    <li><a href="cart.html">Cart (0)</a></li>
                </ul>
            </nav>
        </div>
    </header>

  
    <main class="page">
        <div class="container">

            <h2>Contact Us</h2>
            <p class="subtitle">We’re here to help you</p>

            <div class="contact-box">

 
                <div class="contact-info">
                    <h3>Get in Touch</h3>
                    <p><strong>Email:</strong> support@lootzy.com</p>
                    <p><strong>Phone:</strong> +1 (800) 555-LOOT</p>
                    <p><strong>Address:</strong><br>
                        123 Commerce Lane<br>
                        Digital City, Virtual State
                    </p>
                </div>

                <div class="contact-form">
                    <h1>Send a Message</h1><br>

                    <form>
                        <label>Name</label>
                        <input type="text" placeholder="Your Name" required>

                        <label>Email</label>
                        <input type="email" placeholder="your.email@example.com" required><br><br>

                        <label>Subject</label>
                        <input type="text" placeholder="How can we help?" required>

                        <label>Message</label>
                        <textarea rows="5" placeholder="Write your message..." required></textarea><br><br>

                        <button type="submit" class="btn">Submit</button>
                    </form>
                </div>

            </div>

        </div>
    </main>


    <footer>
        <p>© 2025 LooTZy | Ecommerce Project</p>
    </footer>

</body>

</html>
